<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>候选人偏好分析 - 面试预约助手</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 30px;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .header h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .analysis-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .analysis-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 4s infinite;
        }

        .refresh-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 14px;
            position: relative;
        }

        .refresh-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .debug-info {
            font-size: 12px;
            color: rgba(255,255,255,0.75);
            margin-top: 10px;
            position: relative;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .stat-card i {
            color: #c3c9e8;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .stat-title {
            color: #666;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .stat-hint {
            font-size: 12px;
            color: #999;
        }

        .stat-value.primary { color: #4facfe; }
        .stat-value.success { color: #11998e; }
        .stat-value.warning { color: #f093fb; }
        .stat-value.info { color: #667eea; }

        .reminder-section {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(248,250,252,0.9));
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .reminder-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .send-reminder-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 25px;
            padding: 14px 32px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.3);
        }

        .send-reminder-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.4);
        }

        .send-reminder-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .reminder-message {
            background: linear-gradient(135deg, rgba(17, 153, 142, 0.1), rgba(56, 239, 125, 0.1));
            border-left: 4px solid #11998e;
            border-radius: 0 15px 15px 0;
            padding: 25px;
            margin-top: 25px;
            font-size: 16px;
            line-height: 1.6;
        }

        .time-chip {
            background: #f093fb;
            color: white;
            padding: 4px 10px;
            border-radius: 8px;
            margin: 3px 4px 3px 0;
            display: inline-block;
            font-size: 13px;
        }

        .nav-link {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
        }

        .nav-btn {
            padding: 12px 26px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin: 0 6px;
        }

        .nav-btn.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.3);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
        }

        .actions {
            text-align: center;
            margin-top: 24px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header, .content {
                padding: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2><i class="fas fa-chart-line"></i> 候选人偏好分析</h2>
            <p>基于历史面试记录，分析常申岗位、常选面试官与常用时段</p>
        </div>

        <div class="content">
            <div class="analysis-card">
                <h3 style="margin-bottom: 15px;"><i class="fas fa-search"></i> 偏好画像</h3>
                <p style="margin-bottom: 20px; opacity: 0.9;">数据来源：候选人面试行为记录（candidate_behaviors）</p>
                <button onclick="loadCandidateAnalysis()" class="refresh-btn">
                    <i class="fas fa-sync-alt"></i> 刷新数据
                </button>
                <div id="debug-info" class="debug-info">调试：页面已加载</div>
            </div>

            <!-- 候选人偏好画像 -->
            <div class="stats-grid" id="analysisData">
                <div class="stat-card">
                    <i class="fas fa-user-tie"></i>
                    <div class="stat-title">常选面试官</div>
                    <div id="favoriteInterviewer" class="stat-value primary">正在加载...</div>
                    <div class="stat-hint">按预约次数统计</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-briefcase"></i>
                    <div class="stat-title">常申岗位</div>
                    <div id="favoritePosition" class="stat-value success">正在加载...</div>
                    <div class="stat-hint">决定匹配的招聘方向</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-layer-group"></i>
                    <div class="stat-title">常用轮次 / 形式</div>
                    <div id="favoriteRoundMode" class="stat-value warning">正在加载...</div>
                    <div class="stat-hint">轮次与形式只记录，不参与筛选</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-clock"></i>
                    <div class="stat-title">常用时段 / 时长</div>
                    <div id="favoriteTime" class="stat-value info">正在加载...</div>
                    <div class="stat-hint">用于提醒话术与时长默认值</div>
                </div>
            </div>

            <!-- 面试提醒 -->
            <div class="reminder-section">
                <div class="reminder-title">
                    <i class="fas fa-bell"></i> 面试安排提醒
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;">
                    <div>
                        <p style="color: #666; margin: 0;">结合候选人的岗位、面试官与时段偏好，生成一条面试安排提醒</p>
                        <span id="reminderStatus" style="background: #6c757d; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; margin-top: 8px; display: inline-block;">等待分析</span>
                    </div>
                    <button id="sendReminderBtn" class="send-reminder-btn" onclick="generateReminder()">
                        <i class="fas fa-paper-plane"></i> 生成提醒
                    </button>
                </div>

                <div id="reminderMessage" class="reminder-message" style="display: none;">
                    <h5 style="color: #11998e; margin-bottom: 15px;"><i class="fas fa-comment-dots"></i> 生成的提醒内容：</h5>
                    <p id="messageContent" style="margin-bottom: 15px; color: #333; font-size: 16px;"></p>
                    <div id="availableTimes"></div>
                </div>

                <!-- 面试统计 -->
                <div style="margin-top: 30px; padding: 25px; background: rgba(255,255,255,0.8); border-radius: 15px; border: 1px solid rgba(255,255,255,0.3);">
                    <h4 style="color: #333; margin-bottom: 20px;"><i class="fas fa-chart-bar"></i> 面试统计</h4>
                    <div class="stats-grid" style="margin: 0;">
                        <div style="text-align: center;">
                            <div id="totalInterviews" style="font-size: 28px; font-weight: bold; color: #4facfe; margin-bottom: 8px;">0</div>
                            <div style="color: #666; font-size: 14px;">总面试预约次数</div>
                        </div>
                        <div style="text-align: center;">
                            <div id="daysSinceLastInterview" style="font-size: 28px; font-weight: bold; color: #f093fb; margin-bottom: 8px;">-</div>
                            <div style="color: #666; font-size: 14px;">距上次预约天数</div>
                        </div>
                        <div style="text-align: center;">
                            <div id="shouldSendReminder" style="font-size: 28px; font-weight: bold; color: #11998e; margin-bottom: 8px;">否</div>
                            <div style="color: #666; font-size: 14px;">建议发送提醒</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="actions">
                <a href="/" class="nav-btn">
                    <i class="fas fa-home"></i>
                    返回主界面
                </a>
                <a href="/interviewer" class="nav-btn secondary">
                    <i class="fas fa-user-tie"></i>
                    面试官状态
                </a>
            </div>
        </div>
    </div>

    <script>
        // 使用同源相对路径，避免写死 host/port 导致换了端口页面就取不到数据
        const ANALYSIS_API = '/api/candidate-analysis/analysis';
        const REMINDER_API = '/api/candidate-analysis/send-reminder';

        document.addEventListener('DOMContentLoaded', loadCandidateAnalysis);

        function setText(id, value) {
            const element = document.getElementById(id);
            if (element) {
                element.textContent = value;
            }
        }

        async function loadCandidateAnalysis() {
            const debug = document.getElementById('debug-info');
            try {
                debug.textContent = '调试：正在请求候选人偏好数据...';

                const response = await fetch(ANALYSIS_API, {
                    method: 'GET',
                    headers: {'Accept': 'application/json'}
                });
                if (!response.ok) {
                    throw new Error(`接口返回 ${response.status}`);
                }

                const data = await response.json();

                setText('favoriteInterviewer', data.favorite_interviewer_name || '暂无记录');
                setText('favoritePosition', data.favorite_position || '暂无记录');

                const roundText = data.favorite_round || '暂无记录';
                const modeText = data.favorite_mode || '未记录';
                setText('favoriteRoundMode', `${roundText} · ${modeText}`);

                const periodText = data.preferred_time_period || '未记录';
                const durationText = data.favorite_duration ? `${data.favorite_duration}分钟` : '未记录';
                setText('favoriteTime', `${periodText} · ${durationText}`);

                setText('totalInterviews', data.total_interviews || 0);
                setText(
                    'daysSinceLastInterview',
                    data.days_since_last_interview !== null && data.days_since_last_interview !== undefined
                        ? `${data.days_since_last_interview}天`
                        : '无记录'
                );
                setText('shouldSendReminder', data.should_send_reminder ? '是' : '否');

                const statusElement = document.getElementById('reminderStatus');
                statusElement.textContent = data.should_send_reminder ? '建议发送提醒' : '暂无提醒必要';
                statusElement.style.background = data.should_send_reminder ? '#11998e' : '#6c757d';

                if (!data.total_interviews) {
                    debug.textContent = '调试：暂无面试行为记录，先完成一次面试预约再看分析';
                } else {
                    debug.textContent = `调试：加载完成，共 ${data.total_interviews} 次面试预约`;
                }
            } catch (error) {
                console.error('加载候选人偏好失败:', error);
                debug.textContent = `调试：加载失败 - ${error.message}`;
                ['favoriteInterviewer', 'favoritePosition', 'favoriteRoundMode', 'favoriteTime'].forEach(function (id) {
                    setText(id, '加载失败');
                });
            }
        }

        async function generateReminder() {
            const button = document.getElementById('sendReminderBtn');
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
            button.disabled = true;

            try {
                const response = await fetch(REMINDER_API, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({user_id: 'default_candidate'})
                });
                if (!response.ok) {
                    throw new Error(`接口返回 ${response.status}`);
                }

                const data = await response.json();

                const messageDiv = document.getElementById('reminderMessage');
                document.getElementById('messageContent').textContent = data.message || '提醒生成成功。';

                const availableTimes = document.getElementById('availableTimes');
                const times = data.interviewer_available_times || [];
                if (times.length > 0) {
                    const chips = times.map(function (item) {
                        const label = item.formatted || `${item.date} ${item.time}`;
                        return `<span class="time-chip">${label}</span>`;
                    }).join('');
                    availableTimes.innerHTML = `<strong>面试官可选时段：</strong><br>${chips}`;
                } else {
                    availableTimes.innerHTML = '<span style="color: #888;">暂无可用时段，建议更换面试日期</span>';
                }

                messageDiv.style.display = 'block';

                const statusElement = document.getElementById('reminderStatus');
                statusElement.textContent = '已生成';
                statusElement.style.background = '#11998e';
            } catch (error) {
                console.error('生成面试提醒失败:', error);
                alert('生成面试提醒失败: ' + error.message);
            } finally {
                button.innerHTML = originalText;
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
